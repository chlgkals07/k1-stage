ros:
  heartbeat_topic: /ai_sapiens/api_mode_heartbeat
  status_topic: /ai_sapiens/mode_status
  request_service: /ai_sapiens/request_mode_by_name
  list_modes_service: /ai_sapiens/list_modes
  heartbeat_hz: 10

policy:
  # 이번 무대에서 운영자/패드/dance가 쓸 동작 전부. 최신 실물 mode 목록과
  # selector 백업을 확인한 뒤에만 여기와 motions.yaml을 함께 바꾼다.
  api_allowlist:
    - MimicBowNavel
    - MimicShadowBoxing
    - MimicDanceJazzHands
    - MimicWaveHand
    - MimicBowCourtly
    - MimicNewMacarena001A545
    - MimicNewKnightlyBowR001A429
    - MimicSquat
    - MimicChefsKiss
    - MimicPushUp
    - MimicNewRockOut002A487
    - MimicBadChestpopVer2
    - MimicNewSnuCheerHeadShort
    - MimicStraykidsThisAndThat

  # pad_allowlist 는 여기 없다. 관객 패드 12칸은 안전 정책이 아니라 행사 연출이라
  # config/venues/<행사>/venue.yaml 의 pad_grid 로 옮겼다. 서버는 그 목록을 위의
  # api_allowlist 와 교집합해서 쓰므로, venue 가 권한을 넓힐 수는 없다.

  # 정지는 allowlist와 독립된 안전 경로다.
  stop_state: Velocity
  entry_state: ReadyPose
  entry_timeout_sec: 5
  status_timeout_sec: 1
  relay_timeout_sec: 2
