<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K1 댄스 싱크</title>
<style>
:root{--bg:#0e1116;--panel:#171b22;--line:#2a3240;--fg:#edf1f8;--dim:#97a2b5;--ok:#3ddc84;--bad:#ff6b62;--warn:#ffbd59;--accent:#73a9ff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;flex:1}.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}.dot.ready{background:var(--ok)}.dot.warming{background:var(--warn)}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--dim)}
.badge.mock{color:#171006;background:var(--warn);border-color:var(--warn)}.badge.relay{color:#06101f;background:var(--accent);border-color:var(--accent)}.badge.robot{color:#06140c;background:var(--ok);border-color:var(--ok)}
a,button,select,input{font:inherit}a.button,button{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--panel);color:var(--fg);text-decoration:none;cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);color:#07111f;border-color:var(--accent);font-weight:700}
button.danger{background:#c0263a;border-color:#c0263a;color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1280px;margin:0 auto;padding:14px 18px}
.hint{color:var(--dim);font-size:13px;margin:4px 0 0}
.field{min-width:0}.field label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
select,input[type=number],input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:9px}
input[type=range]{width:100%;margin:0}
.offset-val{font-weight:700;font-variant-numeric:tabular-nums}
/* 설정은 전부 상단 패널 하나에 모은다 */
#controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
#controls .grid{display:grid;gap:10px;align-items:end}
#rowPreset{grid-template-columns:minmax(160px,1fr) auto auto minmax(140px,1fr) auto}
#rowSelect{grid-template-columns:1.2fr 1.2fr 1fr .5fr .5fr}
#rowSync{grid-template-columns:1fr 150px auto auto}
/* 영상 두 개 좌우 */
#videos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.vbox h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
video{width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;border-radius:10px}
#log{font-size:13px;color:var(--dim);white-space:pre-wrap;min-height:3em;margin-top:12px}
@media (max-width:900px){
  #rowPreset,#rowSelect,#rowSync{grid-template-columns:1fr 1fr}
  #videos{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><h1>K1 댄스 싱크</h1><span class="badge" id="badge">MODE 확인 중</span><a class="button" href="/operator">운영자</a></header>
<main>

<div id="controls">
  <div class="grid" id="rowPreset">
    <div class="field"><label for="preset">프리셋</label><select id="preset"></select></div>
    <button id="presetLoad">불러오기</button>
    <button id="presetDel">삭제</button>
    <div class="field"><label for="presetName">저장 이름</label><input type="text" id="presetName" placeholder="예: snucheer"></div>
    <button id="presetSave">현재 설정 저장</button>
  </div>
  <div class="grid" id="rowSelect">
    <div class="field"><label for="motion">동작</label><select id="motion"></select></div>
    <div class="field"><label for="media">음원/영상</label><select id="media"></select></div>
    <div class="field"><label for="clip">로봇 클립 (sim)</label><select id="clip"></select></div>
    <div class="field"><label for="seek">음원 시작 (초)</label><input type="number" id="seek" value="0" step="0.1" min="0"></div>
    <div class="field"><label for="volume">볼륨</label><input type="number" id="volume" value="100" step="5" min="0" max="100"></div>
  </div>
  <div class="grid" id="rowSync">
    <div class="field"><label for="offset">오프셋 (ms) — <span class="offset-val" id="offsetVal">0</span> · <b>+</b>면 로봇 먼저, <b>−</b>면 음원 먼저</label>
      <input type="range" id="offset" min="-5000" max="5000" step="10" value="0"></div>
    <div class="field"><label for="offsetNum">직접 입력</label><input type="number" id="offsetNum" step="10" value="0"></div>
    <label style="display:flex;align-items:center;gap:6px;white-space:nowrap">
      <input type="checkbox" id="onStage" checked> 무대(display)에서 재생</label>
    <button class="primary" id="startBtn">▶ 시작</button>
    <button class="danger" id="stopBtn">■ 정지</button>
  </div>
</div>

<div id="videos">
  <div class="vbox">
    <h2>음원 / 원본 영상</h2>
    <video id="player" controls playsinline preload="auto"></video>
  </div>
  <div class="vbox">
    <h2>로봇 클립 — 0초 = 동작 시작, 모션 요청 시각에 같이 재생</h2>
    <video id="robotClip" controls playsinline preload="auto" muted></video>
  </div>
</div>

<div id="log">아직 실행 없음</div>
</main>
<script>
const $=s=>document.querySelector(s);
const player=$('#player');
let catalog=[], allowed=new Set(), backendName='', timers=[], presets={};

const q=new URLSearchParams(location.search);
if(q.has("token")){q.delete("token");const c=q.toString();history.replaceState(null,"",location.pathname+(c?"?"+c:""));}

function setOffset(v){
  v=Math.max(-5000,Math.min(5000,Math.round(v||0)));
  $('#offset').value=v; $('#offsetNum').value=v; $('#offsetVal').textContent=v;
}
$('#offset').oninput=e=>setOffset(+e.target.value);
$('#offsetNum').oninput=e=>setOffset(+e.target.value);

function log(msg){$('#log').textContent=new Date().toLocaleTimeString()+'  '+msg+'\n'
  +$('#log').textContent.split('\n').slice(0,6).join('\n')}

function fill(sel,pairs,empty){
  sel.innerHTML='';
  pairs.forEach(([v,t])=>sel.appendChild(Object.assign(document.createElement('option'),{value:v,textContent:t})));
  if(!pairs.length&&empty) sel.appendChild(Object.assign(document.createElement('option'),{value:'',textContent:empty}));
}

async function loadMotions(){
  const d=await (await fetch('/motions')).json();
  catalog=d.all||[]; backendName=d.backend||''; allowed=new Set(d.llm_allowed||[]);
  const b=$('#badge');
  b.textContent={mock:'MOCK · 기록만',relay:'RELAY · PC→ROBOT',robot:'ROBOT · 직접 연결'}[backendName]||'MODE 확인 불가';
  b.className='badge '+(backendName||'');
  renderMotions();
  // 클립은 카탈로그 state 이름으로 서빙된다.
  fill($('#clip'), [['','없음'], ...(d.clips||[]).map(s=>[s,s])]);
}
// 댄스 모드에는 무대 3종만 보인다 (2026-08-17 사용자 확정). 다른 동작은 /pad·/operator 로.
const DANCE_STATES=['MimicNewSnuCheerHeadShort','MimicStraykidsThisAndThat','MimicBadChestpopVer2'];
function renderMotions(){
  const sel=$('#motion'), keep=sel.value;
  const list=catalog.filter(m=>DANCE_STATES.includes(m.state));
  fill(sel, list.map(m=>[m.state, m.ko+'  ('+m.state+')']), '무대 동작 없음');
  if(keep&&list.some(m=>m.state===keep)) sel.value=keep;
}
async function loadMedia(){
  const d=await (await fetch('/media')).json();
  fill($('#media'), [['','없음'], ...(d.files||[]).map(f=>[f,f])]);
  loadTrack();
}
function loadTrack(){
  const f=$('#media').value;
  player.src=f?'/media/'+encodeURIComponent(f):'';
  const c=$('#clip').value;
  $('#robotClip').src=c?'/clips/'+encodeURIComponent(c)+'.mp4':'';
}
$('#media').onchange=loadTrack;
// 동작을 고르면 같은 이름의 클립을 자동으로 물린다.
$('#motion').onchange=()=>{
  const want=$('#motion').value;
  if([...$('#clip').options].some(o=>o.value===want)) $('#clip').value=want;
  loadTrack();
};
$('#clip').onchange=loadTrack;
$('#volume').oninput=()=>{player.volume=Math.max(0,Math.min(100,+$('#volume').value||0))/100};

// ── 프리셋 ────────────────────────────────────────────────────
function currentPreset(){
  // 불러온 프리셋의 자막(title/credit)과 영상 길이(media_len_sec)를 함께 실어 보낸다.
  // 빠뜨리면 ① 무대 TV 자막이 비고 ② 저장 시 길이가 사라져 자동 종료가 기본 60초로
  // 떨어져 84초짜리 무대가 곡 중간에 끊긴다 (2026-08-18 리뷰).
  const loaded = presets[$('#preset').value] || {};
  const same = loaded.media === $('#media').value;
  return {motion:$('#motion').value, media:$('#media').value, clip:$('#clip').value,
          seek:+$('#seek').value||0, offset_ms:+$('#offset').value||0,
          volume:+$('#volume').value||0,
          title:same?loaded.title:undefined, credit:same?loaded.credit:undefined,
          media_len_sec:same?loaded.media_len_sec:undefined};
}
function applyPreset(p){
  if(!p) return;
  const set=(sel,v)=>{if([...sel.options].some(o=>o.value===v)) sel.value=v;
    else if(v) log('프리셋 항목 없음: '+v);};
  set($('#motion'),p.motion||''); set($('#media'),p.media||''); set($('#clip'),p.clip||'');
  $('#seek').value=p.seek||0; setOffset(p.offset_ms||0);
  $('#volume').value=p.volume==null?100:p.volume; $('#volume').oninput();
  loadTrack();
}
function renderPresets(){
  const keep=$('#preset').value;
  fill($('#preset'), Object.keys(presets).sort().map(n=>[n,n]), '저장된 프리셋 없음');
  if(keep&&presets[keep]) $('#preset').value=keep;
}
async function loadPresets(){
  const d=await (await fetch('/dance/presets')).json();
  presets=d.presets||{}; renderPresets();
}
async function postPreset(name,preset){
  const r=await fetch('/dance/presets',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,preset})});
  const out=await r.json();
  if(out.presets){presets=out.presets;renderPresets();}
  return out;
}
$('#presetLoad').onclick=()=>{
  const n=$('#preset').value; if(!n) return;
  applyPreset(presets[n]); $('#presetName').value=n; log('프리셋 불러옴: '+n);
};
$('#preset').onchange=$('#presetLoad').onclick;
$('#presetSave').onclick=async()=>{
  const n=($('#presetName').value||'').trim()||$('#motion').value;
  if(!n) return log('프리셋 이름을 입력하세요');
  await postPreset(n,currentPreset()); $('#preset').value=n; $('#presetName').value=n;
  log('프리셋 저장됨: '+n);
};
$('#presetDel').onclick=async()=>{
  const n=$('#preset').value; if(!n) return;
  await postPreset(n,null); log('프리셋 삭제됨: '+n);
};

// ── 실행 ─────────────────────────────────────────────────────
async function refresh(){
  try{
    const d=await (await fetch('/status')).json();
    const g=d.gateway||'offline';
    $('#dot').className='dot '+(g==='ready'?'ready':g==='api_warming'?'warming':'');
    if(backendName!=='mock'&&d.api_allowlist){allowed=new Set(d.api_allowlist);renderMotions()}
  }catch(e){$('#dot').className='dot'}
}

function clearTimers(){timers.forEach(clearTimeout);timers=[]}

async function fireMotion(motion){
  const t0=performance.now();
  try{
    const r=await fetch('/motion',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({motion, reason:'댄스 싱크 실행', source:'manual'})});
    const out=await r.json();
    log((out.ok?'모션 OK':'모션 거부')+' · '+(out.ko||motion)+' · 왕복 '
        +Math.round(performance.now()-t0)+'ms'+(out.msg?' · '+out.msg:''));
  }catch(e){log('모션 요청 실패: '+e.message)}
}

$('#startBtn').onclick=async()=>{
  const motion=$('#motion').value, off=+$('#offset').value;
  clearTimers();
  const btn=$('#startBtn'); btn.disabled=true;
  // 무대 모드: 서버가 스케줄하고 display(TV)가 영상·소리를 튼다. 이 기기에서는 안 튼다.
  // 여기서 /motion 을 직접 쏘면 stage 가 executing 이 되어 display 에 무대 영상이
  // 안 나온다 — 리허설에서 실제로 겪은 그 증상이다.
  if($('#onStage').checked){
    try{
      const r=await fetch('/dance/start',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({preset:currentPreset()})});
      const out=await r.json();
      log(out.ok?('무대 시작 — 2초 뒤 display 에서 재생 (오프셋 '+off+'ms)'):('무대 거부: '+(out.msg||'')));
    }catch(e){log('무대 시작 실패: '+e.message)}
    setTimeout(()=>{btn.disabled=false}, 1500);
    return;
  }
  const seek=Math.max(0,+$('#seek').value||0);
  const clip=$('#robotClip');
  try{
    // iOS 는 사용자 제스처 안에서 play() 를 한 번 거쳐야 이후 타이머에서 재생할 수 있다.
    if(player.src){await player.play(); player.pause();}
    player.currentTime=seek;
    if(clip.src){await clip.play(); clip.pause(); clip.currentTime=0;}
  }catch(e){log('재생 권한 실패: '+e.message)}
  // 둘 중 먼저 나갈 쪽이 0ms. 상대 간격만 의미가 있다.
  const motionAt=Math.max(0,-off), mediaAt=Math.max(0,off);
  log('시작 — 오프셋 '+off+'ms (모션 +'+motionAt+'ms / 음원 +'+mediaAt+'ms)'
      +(motion?'':' · 동작 없음, 음원만'));
  if(motion) timers.push(setTimeout(()=>fireMotion(motion), motionAt));
  // 클립의 0초가 동작 시작이므로 모션 요청과 같은 시각에 튼다.
  if(clip.src) timers.push(setTimeout(()=>clip.play().catch(e=>log('클립 재생 실패: '+e.message)), motionAt));
  timers.push(setTimeout(()=>{
    if(player.src) player.play().catch(e=>log('재생 실패: '+e.message));
  }, mediaAt));
  timers.push(setTimeout(()=>{btn.disabled=false}, Math.max(motionAt,mediaAt)+300));
};

$('#stopBtn').onclick=async()=>{
  clearTimers(); player.pause(); $('#robotClip').pause(); $('#startBtn').disabled=false;
  try{
    // /dance/stop 은 무대(display) 정지 + 예약 취소만 한다 — **로봇은 안 멈춘다**.
    // 로봇을 세우려면 운영자 화면의 빨간 정지(또는 라디오)를 써야 한다.
    const r=await fetch('/dance/stop',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({reason:'댄스 싱크 정지'})});
    const out=await r.json(); log('정지 · '+(out.msg||''));
  }catch(e){log('정지 요청 실패: '+e.message)}
};

Promise.all([loadMedia(),loadMotions(),refresh()]).then(loadPresets).catch(e=>log('초기화 실패: '+e.message));
setInterval(()=>{if(!document.hidden)refresh()},2000);
</script>
</body>
</html>
