# K1 모션 카탈로그
#
# 이 파일이 LLM / 키워드 라우터 / 웹 UI 세 곳의 공통 입력이다.
# state 는 /ai_sapiens/request_mode_by_name 에 그대로 넘기는 이름이다.
#
# safety:
#   safe       상체 위주, 제자리. 관객 근처에서 써도 되는 것
#   caution    전신 사용 또는 이동. 공간 확보 필요
#   restricted 격한 동작. LLM 에게 노출하지 않고 사람이 직접 고를 때만
#
# llm: false 인 항목은 LLM 도구 목록에서 제외된다 (중복 변형본 / 학습 체크포인트).
#      RC 다이얼로는 여전히 부를 수 있다.

motions:

