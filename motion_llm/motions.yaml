  # cooldown_sec: 연타 방지. gateway 가 강제한다. 값이 없는 모션은 대기시간 0 이라
  #   인사류의 "새 발화에서 같은 동작 재실행"(실물 검증됨) 은 그대로 유지된다.
  # interruptible: 데이터만 둔다. 정지는 항상 허용되므로 이 값으로 막지 않는다.
