# 이번 무대의 최소 동작 목록.
#
# 실제 로봇에 로드된 mode와 RC selector가 바뀌면, 이 파일의 state 목록을 먼저 고친다.
# 그 다음 gateway_config.yaml의 allowlist와 rc_list를 같은 목록으로 맞춘다.
# tags/llm/page/학습 메타데이터는 음성·학습 경로를 제거하면서 의도적으로 두지 않는다.

motions:
  # ── 관객 패드 12개 (gateway_config.yaml pad_allowlist 순서와 같음) ──
  - {state: MimicBowNavel,              en: BOW,             ko: 배꼽 인사,  category: greeting,    safety: safe}
  - {state: MimicShadowBoxing,          en: SHADOW BOXING,   ko: 섀도우 복싱, category: intense,     safety: restricted}
  - {state: MimicDanceJazzHands,        en: JAZZ HANDS,      ko: 재즈핸즈,   category: performance, safety: safe}
  - {state: MimicWaveHand,              en: WAVE,            ko: 손 흔들기,  category: greeting,    safety: safe}
  - {state: MimicBowCourtly,            en: COURTLY BOW,     ko: 궁정식 인사, category: greeting,    safety: safe}
  - {state: MimicNewMacarena001A545,    en: MACARENA,        ko: 마카레나,   category: performance, safety: safe}
  - {state: MimicNewKnightlyBowR001A429,en: KNIGHT BOW,      ko: 기사식 인사, category: greeting,    safety: safe}
  - {state: MimicSquat,                 en: SQUAT,           ko: 스쿼트,     category: performance, safety: caution}
  - {state: MimicChefsKiss,             en: CHEF'S KISS,     ko: 손키스,     category: reaction,    safety: safe}
  - {state: MimicPushUp,                en: PUSH UP,         ko: 팔굽혀펴기, category: performance, safety: caution}
  - {state: MimicNewRockOut002A487,     en: ROCK OUT,        ko: 락아웃,     category: performance, safety: caution}
  - {state: MimicBadChestpopVer2,       en: BAD,             ko: BAD,        category: performance, safety: safe}

  # ── dance 전용 (BAD는 패드에도 있으므로 위 항목을 공유) ──
  - {state: MimicNewSnuCheerHeadShort,  en: SNU CHEER,       ko: 서울대 응원, category: performance, safety: caution}
  - {state: MimicStraykidsThisAndThat,  en: STRAY KIDS,      ko: 스트레이키즈, category: performance, safety: caution}

control_states:
  - {state: ReadyPose, ko: 준비 자세, category: control, safety: safe}
  - {state: Velocity,  ko: 보행 대기, category: control, safety: safe}

# 로봇에 배포할 RC 목표 슬롯. 로봇 selector에 이 표를 반영한 뒤 최신 k1_config.yaml
# 백업으로 tools/verify_robot_rc_config.py를 통과시키고, gen_rc_list.py로 재생성한다.
rc_list:
  updated: pending-robot-deploy
  source: deployment target — verify against fresh robot backup before rehearsal
  select:
    bank: CH5
    slot: CH11
  banks:
    A:
      ch5: 1000
      input_code: 4
      slots:
      - {slot: 200, ch11: 1000, state: MimicBowNavel}
      - {slot: 201, ch11: 1020, state: MimicWaveHand}
      - {slot: 202, ch11: 1040, state: MimicBowCourtly}
      - {slot: 203, ch11: 1060, state: MimicNewKnightlyBowR001A429}
      - {slot: 204, ch11: 1080, state: MimicChefsKiss}
      - {slot: 205, ch11: 1100, state: MimicDanceJazzHands}
      - {slot: 206, ch11: 1120, state: MimicNewMacarena001A545}
      - {slot: 207, ch11: 1140, state: MimicNewRockOut002A487}
      - {slot: 208, ch11: 1160, state: MimicSquat}
      - {slot: 209, ch11: 1180, state: MimicShadowBoxing}
    B:
      ch5: 2000
      input_code: 5
      slots:
      - {slot: 200, ch11: 1000, state: MimicPushUp}
      - {slot: 201, ch11: 1020, state: MimicBadChestpopVer2}
      - {slot: 202, ch11: 1040, state: MimicNewSnuCheerHeadShort}
      - {slot: 203, ch11: 1060, state: MimicStraykidsThisAndThat}
